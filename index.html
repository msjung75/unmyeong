function importData(inp){
  const f = inp.files[0]; if(!f) return;
  const rd = new FileReader();
  rd.onload = async () => { try{
    const d = JSON.parse(rd.result);
    if (d.enc){
      const pw = sessionPw || $('#pw-import') && $('#pw-import').value;
      if (!pw){ toast('암호화된 백업 — 먼저 같은 비밀번호로 잠금을 설정하세요'); return; }
      try{ const dec = await decryptData(d, pw, d.salt); people = dec.people||[]; }
      catch(e){ toast('비밀번호가 달라 백업을 열 수 없습니다'); return; }
    }
    else if (Array.isArray(d.people) || Array.isArray(d)) {
      const incoming = Array.isArray(d) ? d : d.people;
      let added=0, updated=0;
      incoming.forEach(np=>{
        if (!np || !np.name || !np.y) return;
        const i = people.findIndex(x=>x.id===np.id || (x.name===np.name && x.y===np.y && x.mo===np.mo && x.d===np.d));
        if (i>=0){ const keep=people[i].id; people[i]=Object.assign({},people[i],np,{id:keep}); updated++; }
        else { people.push(np); added++; }
      });
      savePeople();
      toast('가져오기: '+added+'명 추가'+(updated?', '+updated+'명 갱신':'')); render();
      return;
    }
    else { toast('알 수 없는 파일 형식입니다'); return; }
    savePeople();
    toast('가져오기 완료: '+people.length+'명'); render();
  }catch(e){ toast('파일을 읽을 수 없습니다'); } };
  rd.readAsText(f);
}

/* ---------- 폼 ---------- */
function segVal(id){ return $('#'+id+' button.on').dataset.v; }
function segSet(id,v){ document.querySelectorAll('#'+id+' button').forEach(b=>b.classList.toggle('on',b.dataset.v===v)); }
document.querySelectorAll('.seg').forEach(seg=>seg.addEventListener('click',e=>{
  if(e.target.tagName==='BUTTON'){ seg.querySelectorAll('button').forEach(b=>b.classList.remove('on')); e.target.classList.add('on'); }
}));
function openForm(id){
  editingId = id||null;
  $('#formTitle').textContent = id ? '정보 수정' : '새 사람 등록';
  $('#pasteRow').style.display = id ? 'none' : 'block';
  $('#f-paste').value = '';
  pushNav({v:view, pid:currentId, m:'form'});
  if (id){ const p=people.find(x=>x.id===id);
    $('#f-name').value=p.name; $('#f-tag').value=p.tag||''; segSet('f-gender',p.gender); segSet('f-cal',p.cal);
    $('#f-date').value=''+p.y+pad2(p.mo)+pad2(p.d);
    $('#f-time').value=p.noTime?'':pad2(p.h??12)+pad2(p.min??0);
    $('#f-twin').checked=!!p.twinNext; $('#f-memo').value=p.memo||'';
  } else {
    $('#f-name').value=''; $('#f-tag').value=''; segSet('f-gender','M'); segSet('f-cal','S');
    $('#f-date').value=''; $('#f-time').value=''; $('#f-twin').checked=false; $('#f-memo').value='';
  }
  $('#modalBg').classList.add('show');
}
function closeForm(){ $('#modalBg').classList.remove('show'); }
/* ---------- 문자 자동 인식 ---------- */
function parseFreeText(raw){
  const out = {};
  let s = ' '+String(raw||'').replace(/\s+/g,' ').trim()+' ';
  // 음력/윤달
  if (/음력/.test(s)){ out.cal = /윤달|윤월|\(윤\)/.test(s) ? 'LL' : 'L'; s = s.replace(/음력|윤달|윤월/g,' '); }
  if (/양력/.test(s)){ out.cal = 'S'; s = s.replace(/양력/g,' '); }
  // 성별 (단독 단어만 — 이름 속 글자 오인 방지)
  if (/(여자|여성|\(여\))/.test(s) || /\s여\s/.test(s)){ out.gender='F'; s=s.replace(/여자|여성|\(여\)/g,' ').replace(/\s여\s/,' '); }
  else if (/(남자|남성|\(남\))/.test(s) || /\s남\s/.test(s)){ out.gender='M'; s=s.replace(/남자|남성|\(남\)/g,' ').replace(/\s남\s/,' '); }
  // 날짜: 1983.5.12 / 83-05-12 / 1983/05/12
  let y=null, mo=null, d=null;
  let m = s.match(/(\d{2,4})\s*[.\-\/]\s*(\d{1,2})\s*[.\-\/]\s*(\d{1,2})/);
  if (m){ y=+m[1]; mo=+m[2]; d=+m[3]; s=s.replace(m[0],' '); }
  else {
    m = s.match(/((?:19|20)?\d{2})\s*년/);
    if (m){ y=+m[1]; s=s.replace(m[0],' '); }
    m = s.match(/(\d{1,2})\s*월\s*(\d{1,2})\s*일?/);
    if (m){ mo=+m[1]; d=+m[2]; s=s.replace(m[0],' '); }
  }
  if (y!=null && y<100) y = y>=30 ? 1900+y : 2000+y;
  if (y && mo && d){ out.y=y; out.mo=mo; out.d=d; }
  // 시간: 새벽2시50분 / 오후 3시 / 밤11시반 / 14:30 / 낮12시
  let h=null, min=0;
  m = s.match(/(새벽|아침|오전|낮|점심|오후|저녁|밤)?\s*(\d{1,2})\s*시\s*(반|\d{1,2}\s*분?)?/);
  if (m){
    h = +m[2];
    if (m[3]) min = m[3].includes('반') ? 30 : parseInt(m[3]) || 0;
    const ap = m[1]||'';
    if (/오후|저녁/.test(ap) && h<12) h+=12;
    if (/밤/.test(ap)){ if (h===12) h=0; else if (h<12 && h>=6) h+=12; } // 밤11시=23, 밤12시=0, 밤2시=02(새벽 취급)
    if (/새벽/.test(ap) && h===12) h=0;
    if (/낮|점심/.test(ap) && h<11) h+=12;
    s = s.replace(m[0],' ');
  } else {
    m = s.match(/(\d{1,2})\s*:\s*(\d{2})/);
    if (m){ h=+m[1]; min=+m[2]; s=s.replace(m[0],' '); }
  }
  if (h!=null && h<24 && min<60){ out.h=h; out.min=min; }
  // 이름: 남은 한글 2~4자 (안내어 제외)
  const stop = ['시간','모름','출생','생일','생년','월일','부탁','합니다','해주세요','사주','올해','내년'];
  const tokens = (s.match(/[가-힣]{2,4}/g)||[]).filter(t=>!stop.includes(t));
  if (tokens.length) out.name = tokens[0];
  return out;
}
function parsePaste(){
  const t = ($('#f-paste')||{value:''}).value;
  if (!t.trim()){ toast('먼저 문자를 붙여넣어 주세요'); return; }
  const r = parseFreeText(t);
  if (!r.y){ toast('날짜를 인식하지 못했습니다 — 직접 입력해 주세요'); return; }
  if (r.name) $('#f-name').value = r.name;
  $('#f-date').value = ''+r.y+pad2(r.mo)+pad2(r.d);
  $('#f-time').value = (r.h!=null) ? pad2(r.h)+pad2(r.min) : '';
  if (r.gender) segSet('f-gender', r.gender);
  segSet('f-cal', r.cal||'S');
  toast('인식됨: '+(r.name||'이름?')+' · '+r.y+'-'+pad2(r.mo)+'-'+pad2(r.d)+(r.h!=null?' '+pad2(r.h)+':'+pad2(r.min):' 시간모름')+(r.cal==='L'?' 음력':r.cal==='LL'?' 음력윤달':'')+' — 확인 후 저장하세요');
}
function parseDateStr(s){
  const d = (s||'').replace(/\D/g,'');
  if (d.length!==8) return null;
  const y=+d.slice(0,4), mo=+d.slice(4,6), dd=+d.slice(6,8);
  if (y<1891||y>2050||mo<1||mo>12||dd<1||dd>31) return null;
  const chk = new Date(y, mo-1, dd);
  if (chk.getMonth()!==mo-1 || chk.getDate()!==dd) return null;
  return [y,mo,dd];
}
function parseTimeStr(s){
  const d = (s||'').replace(/\D/g,'');
  if (!d) return null; // 시간 모름
  let h, m;
  if (d.length<=2){ h=+d; m=0; }
  else if (d.length===3){ h=+d.slice(0,1); m=+d.slice(1); }
  else { h=+d.slice(0,2); m=+d.slice(2,4); }
  if (h>23 || m>59) return undefined; // 오류
  return [h,m];
}
function keepTemp(id){
  const p = people.find(x=>x.id===id); if(!p) return;
  delete p._temp;
  savePeople(); render(); toast('저장되었습니다 — 목록에 추가됨');
}
function clearTemps(keepId){
  const before = people.length;
  people = people.filter(x=>!x._temp || x.id===keepId);
  return before !== people.length;
}
function saveForm(temp){
  const name = $('#f-name').value.trim() || (temp ? '이름모름' : '');
  if (!name){ toast('이름을 입력해 주세요'); return; }
  const pd = parseDateStr($('#f-date').value);
  if (!pd){ toast('생년월일을 확인해 주세요 (예: 19831212)'); return; }
  const [y,mo,d] = pd;
  const pt = parseTimeStr($('#f-time').value);
  if (pt===undefined){ toast('시간을 확인해 주세요 (예: 0900)'); return; }
  const noTime = pt===null;
  const [h,min] = pt || [12,0];
  const cal = segVal('f-cal');
  if (cal!=='S' && !solarFromLunar(y,mo,d,cal==='LL')){ toast('음력 날짜를 확인해 주세요'); return; }
  const rec = { id: editingId||('p'+Math.random().toString(36).slice(2,9)), name, tag: $('#f-tag').value.trim(), gender:segVal('f-gender'),
    cal, y, mo, d, h:noTime?null:h, min:noTime?null:min, noTime, twinNext: !noTime && $('#f-twin').checked, memo:$('#f-memo').value };
  if (!editingId) rec.createdAt = Date.now();
  if (temp && !editingId){
    rec._temp = true;
    clearTemps();
    people.unshift(rec);
    closeForm(); openPerson(rec.id);
    toast('임시 보기 — 저장하려면 위의 저장하기를 누르세요');
    return;
  }
  if (editingId){ const i=people.findIndex(x=>x.id===editingId); people[i]=Object.assign(people[i],rec); }
  else people.unshift(rec);
  savePeople(); closeForm(); openPerson(rec.id); toast('저장되었습니다');
}
let _delPending = null;
function delPerson(id){
  if (_delPending !== id){ _delPending = id; toast('한 번 더 누르면 삭제됩니다'); setTimeout(()=>{ if(_delPending===id) _delPending=null; }, 3000); return; }
  _delPending = null;
  people = people.filter(x=>x.id!==id);
  people.forEach(p=>{ if(p.relations) p.relations = p.relations.filter(r=>r.pid!==id); });
  savePeople();
  currentId = people[0] ? people[0].id : null; render(); toast('삭제되었습니다');
}

/* ---------- 시작 ---------- */
function ensureSeed(){
  if (!people.length && !store.get('ug_seeded', false)){
    people = [{id:'sample1', name:'한정훈', gender:'M', cal:'S', y:1983, mo:12, d:12, h:9, min:0, noTime:false, memo:'샘플 데이터입니다. 수정하거나 삭제해도 됩니다.'}];
    store.set('ug_seeded', true);
    savePeople(); currentId='sample1';
  }
}
(async function boot(){
  try{ history.replaceState({v:'home', pid:currentId}, ''); }catch(e){}
  if (!(settings.lock && hasCrypto)) people = store.get('ug_people', []);
  await tryRestoreFile();
  if (settings.lock && hasCrypto){
    $('#lockScreen').classList.add('show');
    setTimeout(()=>$('#lockPw').focus(), 100);
  } else {
    ensureSeed(); render();
  }
})();
</script>
